services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realestate-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: 
      - "1001"

volumes:
  jenkins_home: