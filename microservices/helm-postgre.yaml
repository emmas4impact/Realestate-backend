architecture: standalone

auth:
  postgresPassword: "admin-postgres-password"
  username: "realestate"
  password: "realestate_secret"
  database: "realestate"

primary:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 192Mi
  persistence:
    enabled: true
    storageClass: "linode-block-storage"
    size: 8Gi
