---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: service
        image: 762760349103.dkr.ecr.eu-north-1.amazonaws.com/microservices/platform-service:1.0.5
        ports:
        - containerPort: 5010
        env:
        - name: PORT
          value: "5010"
        - name: NODE_ENV
          value: "production"
        - name: RELEASE_NAME
          value: "embarrassed painting"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GPU_RELEASE
          value: "COTOPAXI"
        - name: LISTINGS_IMAGE_TAG
          value: "1.0.5"
        - name: USERS_IMAGE_TAG
          value: "1.0.7"
        - name: TENANTS_IMAGE_TAG
          value: "1.0.7"
        - name: PROPERTY_IMAGE_TAG
          value: "1.0.7"
        - name: INVENTORY_IMAGE_TAG
          value: "1.0.7"
        - name: PRICE_IMAGE_TAG
          value: "1.0.5"
        - name: PLATFORM_IMAGE_TAG
          value: "1.0.5"
        - name: SEARCH_IMAGE_TAG
          value: "1.0.2"
        envFrom:
        - secretRef:
            name: app-secrets
        resources:
          requests: 
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform
spec:
  type: LoadBalancer
  selector:
    app: platform
  ports:
  - protocol: TCP
    port: 5010
    targetPort: 5010
    
